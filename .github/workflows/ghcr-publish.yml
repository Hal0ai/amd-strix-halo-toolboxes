name: Build & Publish *-server (GHCR)

# Builds the *-server service-mode variants from this fork and pushes
# them to ghcr.io/hal0ai/amd-strix-halo-toolboxes. Separate from
# upstream's build_and_publish.yml (which targets kyuz0's Docker Hub).
#
# Triggers:
#   - push to main that touches a *-server Dockerfile, the shared
#     llama-grammar.patch, gguf-vram-estimator.py, or this workflow
#   - daily 03:15 UTC schedule (picks up llama.cpp upstream churn the
#     same way kyuz0's poll-llama-cpp.yaml does)
#   - workflow_dispatch with optional comma-list of backends to build

on:
  push:
    branches: [main]
    paths:
      - 'toolboxes/Dockerfile.vulkan-radv-server'
      - 'toolboxes/Dockerfile.rocm-7.2.2-server'
      - 'toolboxes/llama-grammar.patch'
      - 'toolboxes/gguf-vram-estimator.py'
      - '.github/workflows/ghcr-publish.yml'
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      backends:
        description: >
          Comma-separated *-server backends to build (e.g.
          "vulkan-radv-server"). Use "all" to build everything.
        required: false
        default: all

env:
  IMAGE: ghcr.io/hal0ai/amd-strix-halo-toolboxes

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.mk.outputs.matrix_json }}
    steps:
      - id: mk
        shell: bash
        run: |
          IN='${{ inputs.backends }}'
          if [[ "$IN" == "all" || -z "$IN" ]]; then
            JSON='["vulkan-radv-server","rocm-7.2.2-server"]'
          else
            IN_CLEAN=$(echo "$IN" | tr -d '[:space:]')
            JSON='["'${IN_CLEAN//,/\",\"}'"]'
          fi
          echo "matrix_json=${JSON}" >> "$GITHUB_OUTPUT"
          echo "Using matrix: ${JSON}"

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        backend: ${{ fromJson(needs.prepare.outputs.matrix_json) }}

    steps:
      - name: Free up runner disk space
        run: |
          echo "Before cleanup:" && df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          docker builder prune --all --force
          echo "After cleanup:" && df -h /

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build timestamp
        run: echo "BUILD_TS=$(date -u +%Y%m%dT%H%M%SZ)" >> $GITHUB_ENV

      - name: Build & push ${{ matrix.backend }}
        working-directory: toolboxes
        shell: bash
        run: |
          set -euo pipefail
          B="${{ matrix.backend }}"
          DF="Dockerfile.$B"
          IMM="${IMAGE}:${B}_${BUILD_TS}"
          CHN="${IMAGE}:${B}"

          echo "→ Building ${DF}"
          docker build --no-cache -t local-build -f "${DF}" .

          echo "→ Tag & push immutable → ${IMM}"
          docker tag local-build "${IMM}"
          docker push "${IMM}"

          echo "→ Tag & push channel → ${CHN}"
          docker tag local-build "${CHN}"
          docker push "${CHN}"
